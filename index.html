<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniCall – Group Video Calling</title>
    <meta name="description" content="Free open group video calling. Join any room, no sign-up needed.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body>

<!-- ═══ LOGIN SCREEN ═══ -->
<div id="login-screen" class="screen active">
    <div class="bg-blobs">
        <div class="blob b1"></div>
        <div class="blob b2"></div>
        <div class="blob b3"></div>
    </div>
    <div class="login-card glass">
        <div class="brand">
            <div class="brand-icon"><i class="fa-solid fa-video"></i></div>
            <div>
                <h1 class="brand-name">OmniCall</h1>
                <p class="brand-sub">Group video — no sign-up, connects any device</p>
            </div>
        </div>

        <div class="preview-wrap">
            <video id="preview-video" autoplay muted playsinline></video>
            <div id="preview-avatar" class="preview-avatar hidden">
                <i class="fa-solid fa-user-slash"></i>
            </div>
            <div class="preview-btns">
                <button id="btn-pre-mic" class="pre-btn" title="Toggle Mic"><i class="fa-solid fa-microphone"></i></button>
                <button id="btn-pre-cam" class="pre-btn" title="Toggle Camera"><i class="fa-solid fa-video"></i></button>
            </div>
        </div>

        <form id="join-form" autocomplete="off">
            <div class="field">
                <label for="inp-name">Your name</label>
                <div class="inp-wrap">
                    <i class="fa-solid fa-user"></i>
                    <input id="inp-name" type="text" placeholder="Enter your name" maxlength="28" required>
                </div>
            </div>
            <div class="field">
                <label for="inp-room">Room name</label>
                <div class="inp-wrap">
                    <i class="fa-solid fa-door-open"></i>
                    <input id="inp-room" type="text" placeholder="common-lounge" value="common-lounge">
                </div>
                <small>Everyone with the same room name connects together</small>
            </div>
            <div class="field">
                <label>Avatar color</label>
                <div class="colors">
                    <button type="button" class="cswatch active" data-c="#3b82f6" style="background:#3b82f6"></button>
                    <button type="button" class="cswatch" data-c="#8b5cf6" style="background:#8b5cf6"></button>
                    <button type="button" class="cswatch" data-c="#ec4899" style="background:#ec4899"></button>
                    <button type="button" class="cswatch" data-c="#10b981" style="background:#10b981"></button>
                    <button type="button" class="cswatch" data-c="#f59e0b" style="background:#f59e0b"></button>
                    <button type="button" class="cswatch" data-c="#06b6d4" style="background:#06b6d4"></button>
                    <button type="button" class="cswatch" data-c="#ef4444" style="background:#ef4444"></button>
                </div>
            </div>
            <button id="btn-join" type="submit" class="btn-join">
                <i class="fa-solid fa-arrow-right-to-bracket"></i> Join Video Call
            </button>
        </form>
    </div>
</div>

<!-- ═══ CALL SCREEN ═══ -->
<div id="call-screen" class="screen hidden">
    <header class="call-hdr">
        <div class="hdr-l">
            <div class="room-pill">
                <span class="live-dot"></span>
                <i class="fa-solid fa-users"></i>
                <span id="room-label">common-lounge</span>
            </div>
            <button id="btn-invite" class="ghost-btn">
                <i class="fa-solid fa-link"></i> Invite
            </button>
        </div>
        <span id="call-timer" class="timer">00:00</span>
        <div class="hdr-r">
            <span id="peer-pill" class="peer-pill"><i class="fa-solid fa-user"></i> 1</span>
        </div>
    </header>

    <div class="workspace">
        <div class="grid-wrap">
            <div id="video-grid" class="video-grid" data-count="1"></div>
        </div>
        <aside id="sidebar" class="sidebar hidden">
            <div class="sb-head">
                <div class="sb-tabs">
                    <button class="stab active" data-panel="chat-panel">
                        <i class="fa-solid fa-comments"></i> Chat
                        <span id="chat-badge" class="badge hidden">0</span>
                    </button>
                    <button class="stab" data-panel="people-panel">
                        <i class="fa-solid fa-user-group"></i> People
                    </button>
                </div>
                <button id="btn-close-sb" class="icon-btn"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="chat-panel" class="panel active">
                <div id="chat-log" class="chat-log">
                    <div class="sys-msg">You're in the call. Say hi! 👋</div>
                </div>
                <form id="chat-form" class="chat-form">
                    <input id="chat-inp" type="text" placeholder="Message everyone…" autocomplete="off">
                    <button type="submit" class="send-btn"><i class="fa-solid fa-paper-plane"></i></button>
                </form>
            </div>
            <div id="people-panel" class="panel hidden">
                <ul id="people-list" class="people-list"></ul>
            </div>
        </aside>
    </div>

    <footer class="controls">
        <div class="ctrl-row">
            <button id="btn-mic"    class="cbtn" title="Mic"><i class="fa-solid fa-microphone"></i><span>Mic</span></button>
            <button id="btn-cam"    class="cbtn" title="Camera"><i class="fa-solid fa-video"></i><span>Camera</span></button>
            <button id="btn-screen" class="cbtn" title="Share Screen"><i class="fa-solid fa-desktop"></i><span>Share</span></button>
            <button id="btn-hand"   class="cbtn" title="Raise Hand"><i class="fa-solid fa-hand"></i><span>Hand</span></button>
            <button id="btn-chat"   class="cbtn" title="Chat"><i class="fa-solid fa-message"></i><span>Chat</span></button>
            <button id="btn-people" class="cbtn" title="People"><i class="fa-solid fa-user-group"></i><span>People</span></button>
            <button id="btn-leave"  class="cbtn cbtn-danger" title="Leave"><i class="fa-solid fa-phone-slash"></i><span>Leave</span></button>
        </div>
    </footer>
</div>

<div id="toasts" class="toasts"></div>

<!-- MQTT WebSockets Library for Zero-Config Global Signaling -->
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<!-- Main WebRTC Application Logic -->
<script src="static/js/main.js"></script>
</body>
</html>
